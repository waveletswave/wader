name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DHSVM_COMMIT: e6f333d0e70ed72345d52f1ab83e35317fa92458
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  unit:
    name: Lint and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -m "not case_data and not dhsvm"

  chiwawa:
    name: Serial DHSVM + Chiwawa conformance
    runs-on: ubuntu-24.04
    env:
      WADER_REQUIRE_CASES: "1"   # tests that need data fail instead of skipping
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'

      - name: Cache DHSVM build
        uses: actions/cache@v5
        with:
          path: ~/.cache/wader/dhsvm
          key: dhsvm-${{ runner.os }}-${{ env.DHSVM_COMMIT }}-${{ hashFiles('scripts/build_dhsvm.sh') }}
      - name: Build serial DHSVM (pnnl/DHSVM-PNNL e6f333d)
        run: |
          gcc --version | head -n1
          dhsvm="$(scripts/build_dhsvm.sh | tail -n1)"
          test -x "$dhsvm"
          echo "WADER_DHSVM=$dhsvm" >> "$GITHUB_ENV"

      - name: Cache Chiwawa case
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/wader/cases
            !~/.cache/wader/cases/*/run
          key: chiwawa-${{ env.DHSVM_COMMIT }}-${{ hashFiles('cases/chiwawa/fetch.py', 'src/wader/models/dhsvm/met.py') }}
      - name: Fetch Chiwawa (only the forcing DHSVM uses) and check the selection with DHSVM
        run: python cases/chiwawa/fetch.py --verify-selection "$WADER_DHSVM"

      - name: Run DHSVM on Chiwawa for one month
        run: python cases/chiwawa/run.py --dhsvm "$WADER_DHSVM"

      - name: Conformance tests (Chiwawa, mutations, DHSVM runs)
        run: pytest -m "case_data or dhsvm"

      - name: Demo (reversed network)
        run: scripts/demo_reverse_network.sh

      - name: Upload run logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: chiwawa-run-logs
          path: ~/.cache/wader/cases/*/run/*/*.log
          if-no-files-found: ignore
